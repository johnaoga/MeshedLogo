[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshedlogo"
version = "0.1.0"
description = "A professional Python system for generating beautiful triangle-meshed logos from text and mathematical formulas"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "João Agostinho", email = "your.email@example.com"}
]
keywords = ["logo", "graphics", "mesh", "triangulation", "visualization", "design"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Artistic Software",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "myst-parser>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/johnaoga/mema-inma-logo"
Documentation = "https://johnaoga.github.io/mema-inma-logo/"
Repository = "https://github.com/johnaoga/mema-inma-logo"
"Bug Tracker" = "https://github.com/johnaoga/mema-inma-logo/issues"

[project.scripts]
meshedlogo = "bin.generate_logo:main"

[tool.setuptools]
packages = ["lib"]
py-modules = ["meshed_logo"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]
