[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshedlogo"
version = "0.1.0"
description = "Generate beautiful triangle-meshed logos from text and LaTeX formulas"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "John Aoga", email = "johnaoga@gmail.com"}
]
keywords = ["logo", "graphics", "mesh", "triangulation", "delaunay", "visualization", "design", "latex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Artistic Software",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "myst-parser>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/johnaoga/MeshedLogo"
Documentation = "https://johnaoga.github.io/MeshedLogo/"
Repository = "https://github.com/johnaoga/MeshedLogo"
"Bug Tracker" = "https://github.com/johnaoga/MeshedLogo/issues"
Changelog = "https://github.com/johnaoga/MeshedLogo/blob/main/CHANGELOG.md"

[project.scripts]
meshedlogo = "meshedlogo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
